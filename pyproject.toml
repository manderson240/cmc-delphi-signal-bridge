[project]
name = "cmc-delphi-signal-bridge"
version = "0.2.0"
description = "Turns live CoinMarketCap data into a dated, hashed evidence note for one side of a prediction market. CLI and stdio MCP server, standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
cmc-bridge = "cmc_delphi_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmc_delphi_bridge"]

[dependency-groups]
dev = ["pytest>=8.0"]
